name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index.html is written without a document skeleton (the Claude artifact
      # viewer adds its own), so wrap it for standalone hosting.
      - name: Build site
        run: |
          mkdir -p _site
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<meta name="theme-color" content="#0a0f1c">'
            echo '</head><body>'
            cat index.html
            echo '</body></html>'
          } > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
